version: "3.9"

services:
  serveur:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: serveur
    ports:
      - "5000:5000"
    command: ./serveur_bin

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: client
    depends_on:
      - serveur

