services:
  serveur:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: serveur
    ports:
      - "5000:5000"
    command: ./serveur_bin
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 2s
      timeout: 2s
      retries: 10

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: client
    stdin_open: true
    tty: true
    depends_on:
      - serveur
    command: tail -f /dev/null
